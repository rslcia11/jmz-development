<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 24" fill="none">
  <!-- C · Bloques: J, M and Z built from the system's modules; the core sits inside the M. -->
  <g fill="#f5f3ee">
    <!-- J -->
    <rect x="0" y="0" width="12" height="4.5" rx="1"/>
    <rect x="7.5" y="5.5" width="4.5" height="13" rx="1"/>
    <rect x="0" y="11" width="4.5" height="7.5" rx="1"/>
    <rect x="0" y="19.5" width="12" height="4.5" rx="1"/>
    <!-- M -->
    <rect x="15" y="0" width="4.5" height="24" rx="1"/>
    <rect x="32.5" y="0" width="4.5" height="24" rx="1"/>
    <rect x="20.5" y="0" width="11" height="4.5" rx="1"/>
    <!-- Z -->
    <rect x="40" y="0" width="16" height="4.5" rx="1"/>
    <rect x="49" y="5.5" width="7" height="4" rx="1"/>
    <rect x="44.5" y="10.5" width="7" height="3" rx="1"/>
    <rect x="40" y="14.5" width="7" height="4" rx="1"/>
    <rect x="40" y="19.5" width="16" height="4.5" rx="1"/>
  </g>
  <!-- The M's middle stroke is the core. -->
  <rect x="23.75" y="5.5" width="4.5" height="10" rx="1" fill="#d6a56b"/>
</svg>
